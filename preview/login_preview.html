<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview — Login</title>
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<div class="auth-card">
  <div class="auth-brand">
    <span class="seal">🎓</span>
    <div>
      <strong>HAFED POLY CS Timetable</strong>
      <small>Hussaini Adamu Federal Polytechnic, Kazaure</small>
    </div>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in with your registration number or email.</p>

  <form>
    <label>Registration Number or Email</label>
    <input type="text" placeholder="e.g. ND/CS/25/039 or you@hafedpoly.edu.ng">

    <label>Password</label>
    <div class="password-field">
      <input type="password" id="pw" placeholder="••••••••">
      <button type="button" class="toggle-password" data-target="pw">
        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <button type="submit" class="btn-submit">Log In</button>
  </form>

  <div class="auth-footer">
    New student? <a href="#">Create an account</a>
  </div>
</div>
<script>
document.querySelectorAll('.toggle-password').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.querySelector('.icon-eye').style.display = isHidden ? 'none' : 'block';
    btn.querySelector('.icon-eye-off').style.display = isHidden ? 'block' : 'none';
  });
});
</script>
<script src="../public/assets/js/theme.js"></script>
<script src="../public/assets/js/confirm-dialog.js"></script>
</body>
</html>
